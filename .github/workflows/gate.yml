name: gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      postgres: ${{ steps.plan.outputs.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tools at the commit tools/versions pins
        if: ${{ github.repository != 'rfnry/tools' }}
        run: |
          git init -q ../tools
          git -C ../tools fetch -q --depth 1 -- https://github.com/rfnry/tools.git "$(sed -n 's/^TOOLS_COMMIT=//p' tools/versions)"
          git -C ../tools -c advice.detachedHead=false checkout -q FETCH_HEAD
      - name: The commit tools/versions and ci.yml pin, and the tools fetched at it
        if: ${{ github.repository != 'rfnry/tools' }}
        run: bash ../tools/scripts/pin.sh
      - name: The Postgres versions .github/postgres names, each with its pinned image
        id: plan
        run: bash ../tools/scripts/plan.sh >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.plan.outputs.postgres) }}
    name: test (postgres ${{ matrix.postgres.version }})
    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RFNRY_TEST_POSTGRES_URL: ${{ matrix.postgres.version != 'none' && 'postgresql://harness:harness@localhost:5432/harness' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tools at the commit tools/versions pins
        if: ${{ github.repository != 'rfnry/tools' }}
        run: |
          git init -q ../tools
          git -C ../tools fetch -q --depth 1 -- https://github.com/rfnry/tools.git "$(sed -n 's/^TOOLS_COMMIT=//p' tools/versions)"
          git -C ../tools -c advice.detachedHead=false checkout -q FETCH_HEAD
      - name: The siblings .github/reads names, at this branch where they have it
        run: bash ../tools/scripts/siblings.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ hashFiles('packages/python/pyproject.toml') != '' }}
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ hashFiles('packages/typescript/package.json') != '' }}
        with:
          node-version: "24"
      - name: The gate
        run: bash ../tools/scripts/gate.sh

  gate:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every test passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "gate: the tests ended $RESULT"
            exit 1
          fi
          echo "gate: every test passed"
