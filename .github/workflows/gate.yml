name: gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      postgres: ${{ steps.plan.outputs.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: The Postgres versions .github/postgres names, each with its pinned image
        id: plan
        run: |
          set -euo pipefail
          image() {
            case "$1" in
              16) echo "pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f" ;;
              17) echo "pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8" ;;
              18) echo "pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47" ;;
              *) echo "gate: Postgres $1 has no pinned image in tools' gate.yml" >&2; exit 1 ;;
            esac
          }
          entries=()
          if [ -f .github/postgres ]; then
            while read -r version; do
              [ -z "$version" ] || entries+=("{\"version\":\"$version\",\"image\":\"$(image "$version")\"}")
            done < .github/postgres
          fi
          [ "${#entries[@]}" -gt 0 ] || entries=("{\"version\":\"none\",\"image\":\"$(image 16)\"}")
          echo "postgres=[$(IFS=,; echo "${entries[*]}")]" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.plan.outputs.postgres) }}
    name: test (postgres ${{ matrix.postgres.version }})
    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RFNRY_TEST_POSTGRES_URL: ${{ matrix.postgres.version != 'none' && 'postgresql://harness:harness@localhost:5432/harness' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tools at the commit tools/versions pins, and the siblings .github/reads names
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" = rfnry/tools ]; then
            ln -s "$PWD" ../tools
          else
            commit=$(sed -n 's/^TOOLS_COMMIT=//p' tools/versions)
            git init -q ../tools
            git -C ../tools fetch -q --depth 1 https://github.com/rfnry/tools.git "$commit"
            git -C ../tools -c advice.detachedHead=false checkout -q FETCH_HEAD
          fi
          if [ -f .github/reads ]; then
            while read -r sibling; do
              [ -z "$sibling" ] || git clone -q --depth 1 "https://github.com/rfnry/$sibling.git" "../$sibling"
            done < .github/reads
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ hashFiles('packages/python/pyproject.toml') != '' }}
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ hashFiles('packages/typescript/package.json') != '' }}
        with:
          node-version: "24"
      - name: The gate
        run: bash ../tools/scripts/gate.sh

  gate:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every test passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "gate: the tests ended $RESULT"
            exit 1
          fi
          echo "gate: every test passed"
